<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form> <!-- Створюється форма -->
        
        <!-- INPUT -->
        <input/> <!-- Створює різні елементи форм, як текст, кнопки, перемикачі та прапорці -->
        <!-- НАСТУПНІ ЕЛЕМЕНТИ ФОРМИ ЗА ДОПОМОГОЮ INPUT -->
        <input type="text"/> <!-- Текстове поле -->
        <input type="password"/> <!-- Поле з паролем -->
        <input type="radio"/> <!-- Перемикач -->
        <input type="checkbox"/> <!-- Прапорець -->
        <input type="hidden"/> <!-- Приховане поле -->
        <input type="button"/> <!-- Кнопка -->
        <input type="submit"/> <!-- Кнопка для відправлення форми -->
        <input type="reset"/> <!-- Кнопка для очищення форми -->
        <input type="file"/> <!-- Кнопка для відправлення файлу -->
        <input type="image"> <!-- Кнопка із зображенням -->

        <fieldset> <!-- Використовується для групування пов'язаних елементів у формі -->
            <legend> <!-- Заголовока для групи елементів форми --></legend>
            <label for="label"> <!-- Текстова мітка для елемента input, за допомогою нього можна натиснути на текст та одразу перейти на елементи форми, а не по самому елементу input  -->
                <input id="label">
            </label>
            <select name="" id=""> <!-- Дозволяє створити елемент у вигляді списку, що розкривається, спимок може бути множинними аб одинарним -->
                <option value=""> <!-- Кожен пункт елементу select -->

                </option>
            </select>
        </fieldset>

    </form>
    
</body>
</html>
